                    <option value="new-balance">New Balance</option>
                    <option value="sergio-tacchini">Sergio Tacchini</option>
                    <option value="crocs">Crocs</option>
                    <option value="fila">Fila</option>
                    <option value="converse" selected>Converse</option>
                    <option value="asics">Asics</option>
                    <option value="hoka">Hoka</option>
                    <option value="lacoste">Lacoste</option>
                    <option value="on">On</option>
                    <option value="puma">Puma</option>
                    <option value="reebok">Reebok</option>
                    <option value="salomon">Salomon</option>
                    <option value="ugg">Ugg</option>
                    <option value="saucony">Saucony</option>
                    <option value="vans">Vans</option>
                    <option value="havaianas">Havaianas</option>
                    <option value="kappa">Kappa</option>
                    <option value="under-armour">Under Armour</option>
                    <option value="diadora">Diadora</option>                            
                </select>
                <!--MODEL-->
                <label for="model-product-admin">Model</label>
                <input type="text" id="model-product-admin" maxlength="14" value="CHUCK 70 HIGH" readonly>
                <!--GENRE-->
                <fieldset>
                    <legend>Genre</legend>
                    <label for="man-product-admin">Man</label>
                    <input id="man-product-admin" class="genre-product-admin" type="checkbox" value="man" disabled checked/>
                    <label for="woman-product-admin">Woman</label>
                    <input id="woman-product-admin" class="genre-product-admin" type="checkbox" value="woman" disabled/>
                    <label for="kids-product-admin">Kids</label>
                    <input id="kids-product-admin" class="genre-product-admin" type="checkbox" value="kids" disabled/>
                </fieldset>
                <!--CATEGORY-->
                <fieldset>
                    <legend>Category</legend>
                    <label for="sneakers-product-admin">Sneakers</label>
                    <input id="sneakers-product-admin" type="radio" name="category-product-admin" value="sneakers" disabled checked>
                    <label for="sandals-product-admin">Sandals</label>
                    <input id="sandals-product-admin" type="radio" name="category-product-admin" value="sandals" disabled>
                    <label for="sliders-product-admin">Sliders</label>
                    <input id="sliders-product-admin" type="radio" name="category-product-admin" value="sliders" disabled>
                </fieldset>
                <!--IMAGES-->
                <label for="images-product-admin">Images</label>
                <input type="file" id="images-product-admin" accept=".png, .jpg, .jpeg" disabled>
                <div class="images-product-to-delete">
                    <!-- Since a product to be published must have exactly 4 images, we put the 4 tags directly. -->
                    <img src="CSS/Images/Illustrations/sneaker_test2.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_1.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_2.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_3.webp" alt="">
                </div>
                <!--DESCRIPTION-->

                <textarea name="description-product-admin" id="description-product-admin" cols="30" rows="10" readonly>Durable canvas upper for that classic Chuck 70 look and feel. OrthoLite cushioning helps to provide optimal comfort. Vintage-inspired design elements like an egret midsole, ornate stitching, and a taller rubber sidewall. Iconic Chuck Taylor ankle patch and vintage All Star license plate. Iconic Chuck Taylor ankle patch and vintage All Star license plate.</textarea>
                <!--PRICE-->
                <label for="price-product-admin">Price</label>
                <span>€<input id="price-product-admin" type="number" value="74.99" min="0.01" max="999.99" step="0.01" onblur="standardisePrice()" readonly></span>
