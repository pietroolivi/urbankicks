        <script>
            function standardiseQuantity() {
                inputTag = event.currentTarget;
                if(inputTag.value <= 0) {
                    inputTag.value = 0;
                }                
                if(inputTag.value > 99) {
                    inputTag.value = 99;
                }        
                if(inputTag.value[0] == 0 && inputTag.value.length > 1) {
                    inputTag.value = inputTag.value.slice(1, inputTag.maxLength);
                }
            }
        </script>
