                <!--IMAGES-->
                <!-- 
                As soon as I open the page, the file input will be empty because the images were inserted and sent by the admin 
                during the product publication when the form was submitted, after which it got reset. Similarly to the removal 
                we will have to re-fill the fields by retrieving the data from the DB. However, <input type=‘file’> cannot be 
                assigned values for security reasons (otherwise we could automatically load client-side disk file system paths 
                containing sensitive information, e.g. ‘value=’c:/passwords.txt‘’). What do we do then for images? Surely we will 
                have 4 <img> tags outside the input to show the images currently loaded, which will initially be set to those in 
                the DB. Then we will have two cases:
                (1) The user may not want to change them, so on form submit we'll have to send the ones that were there before 
                (and which we display) but since we can't assign values to <input type=‘file’> we'll have to make the input optional 
                and do a PHP check like: no value entered? I'll leave the ones that were already there.
                (2) The user wants to change them all, at which point there would be no problem as the script will make sure exactly 
                4 are loaded (and this only happens if we click the button, otherwise it will not complain).
                -->
                <label for="images-product-admin-edit">Images</label>
                <input type="file" id="images-product-admin-edit" accept=".png, .jpg, .jpeg" multiple>
                <p id="error-images-product-admin">Please, upload exactly 4 pictures.</p>
                <div class="images-product-to-edit">
                    <img src="CSS/Images/Illustrations/sneaker_test2.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_1.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_2.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_3.webp" alt="">
                </div>
                <script>
                    /* ********************************************************************* */
                    /* We make sure that the admin uploads exactly 4 images for the product. */
                    /* ********************************************************************* */
                    var uploader = document.getElementById('images-product-admin-edit');
                    var error = document.getElementById('error-images-product-admin');
                    uploader.addEventListener("change", function(){
                        if(uploader.files.length != 4){
                            error.style.display='block';
                            document.querySelector(".fields-product-admin > button[type='submit']").disabled = true;
                        } else {
                            document.querySelector(".fields-product-admin > button[type='submit']").disabled = false;
                            error.style.display='none';
                        }
                        // We update the preview of presently uploaded images.
                        document.getElementsByClassName("images-product-to-edit")[0].innerHTML = "";
                        for (image of uploader.files) {
                            console.log(image);
                            document.getElementsByClassName("images-product-to-edit")[0].innerHTML += `
                                <img src="${URL.createObjectURL(image)}" alt="">
                            `
                        }
                    })
                </script>

                <label for="description-product-admin">Description</label>
                <textarea name="description-product-admin" id="description-product-admin" cols="30" rows="10" required>Durable canvas upper for that classic Chuck 70 look and feel. OrthoLite cushioning helps to provide optimal comfort. Vintage-inspired design elements like an egret midsole, ornate stitching, and a taller rubber sidewall. Iconic Chuck Taylor ankle patch and vintage All Star license plate. Iconic Chuck Taylor ankle patch and vintage All Star license plate.</textarea>

                <script>
                    function standardisePrice() {
                        inputTag = event.currentTarget;
                        // We must isolate case ‘0’ otherwise it would be eaten in the next cycle.
                        if (parseFloat(inputTag.value) == 0) {
                            inputTag.value = 0.01;
                            return;
                        }     
                        // We remove the non-significant zeros (left) in the decimal part, except for the zero before the decimal point.
                        while (inputTag.value[0] == 0 && inputTag.value.indexOf(".") != 1) {
                            inputTag.value = inputTag.value.substring(1);
                        }
                        // If the number has more than three integer digits, we cut what comes after the second (excluded) and before the dot (excluded).
                        if (inputTag.value.indexOf('.') != -1 && (inputTag.value.length - inputTag.value.substring(inputTag.value.indexOf('.')).length) > 3) {
                            decimalPart = inputTag.value.substring(0, inputTag.value.indexOf('.'));
                            inputTag.value = decimalPart.substring(0, 3) + inputTag.value.substring(inputTag.value.indexOf('.')); 
                        } else if (inputTag.value.indexOf('.') == -1 && inputTag.value.length > 3) {
                            inputTag.value = inputTag.value.substring(0, 3);
                        }
                        // We put an external if to avoid side-effects in case there is no decimal point.
                        if (inputTag.value.indexOf(".") != -1) {
                            // If the number has more than two decimal digits, we cut off what comes after the second one (excluded).
                            if ((inputTag.value.length - 1) - inputTag.value.indexOf(".") > 2) {
                                inputTag.value = inputTag.value.substring(0, inputTag.value.indexOf(".") + 3);
                            } 
                            // If there is only one decimal digit, we concatenate a zero.
                            if ((inputTag.value.length - 1) - inputTag.value.indexOf(".") == 1) {
                                inputTag.value = inputTag.value + "0";
                            }
                            // If there is a dot but no decimal digit we add 2 zeros.
                            if ((inputTag.value.length - 1) - inputTag.value.indexOf(".") == 0) {
                                inputTag.value = inputTag.value + "00";
                            }
                        }
                        // If there is no dot we add it followed by 2 zeros.
                        if (inputTag.value.indexOf(".") == -1) {
                            inputTag.value = inputTag.value + ".00";
                        }
                        // If there is a dot but no integer we add 1 initial zero.
                        if (inputTag.value[0] == ".") {
                            inputTag.value = "0" + inputTag.value;
                        }
                    }

                        <td headers="row-41 col-black"><label for="row-41-col-black">Quantity in size 41 and colour black.</label><input id="row-41-col-black" type="number" onkeyup="standardiseQuantity()" value="0"/></td>
                    </tr>
                </table>
                <button type="reset" onclick="restoreOriginalImages()">Reset</button>
                <button type="submit">Publish</button>
            </form>
        </main>
        <script>
            function standardiseQuantity() {
                inputTag = event.currentTarget;
                maxlength = 2;
                if (inputTag.value <= 0) {
                    inputTag.value = 0;
                }                
                if (inputTag.value > 99) {
                    inputTag.value = 99;
                }
                // We remove non-significant zeros.   
                if (inputTag.value[0] == 0 && inputTag.value.length > 1) {
                    inputTag.value = inputTag.value.slice(1, maxlength);
                }
            }
        </script> 
        <script>
            /* ****************************************************************************** */
            /* We must ensure that when the reset button of the form is pressed, the previews */
            /* of the images in the DB, which were inserted when the product was published    */
            /* or in a previously made edit, are restored within the <div> element.           */
            /* ****************************************************************************** */
            function restoreOriginalImages() {
                document.getElementsByClassName("images-product-to-edit")[0].innerHTML = `
                    <img src="CSS/Images/Illustrations/sneaker_test2.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_1.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_2.webp" alt="">
                    <img src="CSS/Images/Illustrations/sneaker_test2_3.webp" alt="">
                `;
                document.getElementById('error-images-product-admin').style.display='none';
            }
        </script>
